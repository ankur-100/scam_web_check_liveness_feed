 w-100 placeholder-glow"><span class="col-12 placeholder placeholder-xs"></span></span></div></div></div></footer></main></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"site":{"name":"hdbinfoweb","language":"en","hostName":"*"},"locale":"en","layoutData":{"sitecore":{"context":{"visitorIdentificationTimestamp":639312615931371100,"pageEditing":false,"site":{"name":"hdbinfoweb"},"pageState":"normal","language":"en","itemPath":"/security-advisory"},"route":{"name":"security-advisory","displayName":"Security Advisory","fields":{"hidePage":{"value":false},"publishedDate":{"value":"0001-01-01T00:00:00Z"},"sidebar":{"value":false},"topicTags":[],"metaDescription":{"value":"Learn how to protect yourself from phishing scams."},"navigationTitle":{"value":"Security Advisory"},"pageDescrition":{"value":"Learn how to protect yourself from phishing scams."},"pageTitle":{"value":"Security Advisory"}},"databaseName":"web","deviceId":"fe5d7fdf-89c0-4d99-9aa3-b5fbd009c9f3","itemId":"b5d26b4c-72e4-408c-a715-07a7d73773f4","itemLanguage":"en","itemVersion":1,"layoutId":"af038be7-4964-5e5b-8587-c77df5a9ad86","templateId":"69b30267-a6b6-52fa-9533-4766acd90000","templateName":"Destination Page","placeholders":{"homepage":[],"jss-main":[{"uid":"2fe5ac51-2d5e-4401-913f-48338cabf3b3","componentName":"PageHeader","dataSource":"{B5D26B4C-72E4-408C-A715-07A7D73773F4}","fields":{"hidePage":{"value":false},"publishedDate":{"value":"0001-01-01T00:00:00Z"},"sidebar":{"value":false},"topicTags":[],"metaDescription":{"value":"Learn how to protect yourself from phishing scams."},"navigationTitle":{"value":"Security Advisory"},"pageDescrition":{"value":"Learn how to protect yourself from phishing scams."},"pageTitle":{"value":"Security Advisory"}}}],"intent-landing-page":[],"destination-page":[{"uid":"4eeed8ca-870f-41f5-bef7-8eb05eb81761","componentName":"BodyContent","dataSource":"{C28BE13B-56BE-4EA7-88CA-BFC7373331ED}","fields":{"bodyContent":{"value":"\u003cstyle\u003e\n    .images_main {\n    padding: 0;\n    margin: 20px auto 0;\n    text-align: center;\n    width: 81%;\n    }\n    .images_main .images_sub {\n    width: 300px;\n    display: inline-block;\n    padding: 20px;\n    vertical-align: top;\n    }\n    .images_sub img {\n    padding-bottom: 20px;\n    max-width: 100%;\n    height: auto;\n    }\n    .images_sub p {\n    padding-top: 10px;\n    text-align: left;\n    }\n    .content_width {\n    width: 80%;\n    margin: 0 auto;\n    }\n    @media (min-width: 1000px) {\n    .images_main {\n    width: 70%;\n    }\n    }\n    @media screen and (max-width: 992px) {\n    .images_main {\n    width: 85%;\n    }\n    .content_width {\n    width: 100%;\n    }\n    }\n    @media screen and (max-width: 600px) {\n    .images_main {\n    width: 100%;\n    }\n    .content_width {\n    width: 100%;\n    }\n    }\n\u003c/style\u003e\n\u003cp\u003e\nThere has been an increase in phishing scams, where scammers impersonate organisations to trick customers into sharing their personal information and passwords.\n\u003c/p\u003e\n\u003ch2 class=\"content_width\" style=\"text-align:center; margin:30px auto 0;\"\u003e\nHere are some ways for you to protect yourself from phishing scams:\n\u003c/h2\u003e\n\u003cdiv class=\"images_main\"\u003e\n\u003cdiv class=\"images_sub\"\u003e\n\u003cimg alt=\"Verify links\" src=\"/-/media/security-advisory/security-advisory-image-1.png\" /\u003e\n\u003cp\u003eVerify links before accessing them\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"images_sub\"\u003e\n\u003cimg alt=\"Ensure official links\" src=\"/-/media/security-advisory/security-advisory-image-2.png\" /\u003e\n\u003cp\u003eEnsure links are directing to \".hdb.gov.sg\" or \"go.gov.sg\" websites.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"images_sub\"\u003e\n\u003cimg alt=\"Check lock icon\" src=\"/-/media/security-advisory/security-advisory-image-4.png\" /\u003e\n\u003cp\u003eLook out for the lock icon beside the URL, which signals that data traffic within the site is encrypted.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"images_sub\"\u003e\n\u003cimg alt=\"Do not share OTP\" src=\"/-/media/security-advisory/security-advisory-image-5.png\" /\u003e\n\u003cp\u003eNever reveal One-Time Password (OTP) and credit card details over an email, SMS or phone call.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"images_sub\"\u003e\n\u003cimg alt=\"Check for misspelling\" src=\"/-/media/security-advisory/security-advisory-image-3.png\" /\u003e\n\u003cp\u003eCheck for any misspelling, substitution of letters, and/or the deliberate shifting of \".gov.sg\" to other parts of the web address.\u003c/p\u003e\n\u003cp\u003e\n\u003cimg alt=\"Legitimate link\" style=\"width:25px; padding-right:5px;\" src=\"/-/media/security-advisory/security-advisory-tick-image.png\" /\u003e\nExample of a legitimate link: www.hdb.gov.sg/estatement\n\u003cbr /\u003e\n\u003cimg alt=\"Suspicious link\" style=\"width:25px; padding-right:5px;\" src=\"/-/media/security-advisory/security-advisory-cross-image.png\" /\u003e\nExample of a suspicious link: www.hdb.org.sg/estaetment.gov.sg\n\u003c/p\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"content_width\" style=\"background:#FFF0C9; padding:20px; text-align:center; margin:30px auto 0;\"\u003e\nPlease \u003ca href=\"/about-us/contact-us\"\u003econtact us\u003c/a\u003e\u0026nbsp;immediately \u003cbr /\u003e\nshould you receive any suspicious email, SMS or phone call.\n\u003c/div\u003e"}}}],"landing-page":[],"advisory-banner":[{"uid":"4e5382e8-6a69-4a43-884a-7af7d1250946","componentName":"AdvisoryBanner","dataSource":"","placeholders":{"advisory-banner":[]}}],"rich-text-format-page":[],"listing-content":[],"hip-polling-page":[]}}}},"dictionary":{"Documentation":"Documentation","GraphQL":"GraphQL","Tracking":"Tracking"},"headLinks":[],"componentProps":{"2fe5ac51-2d5e-4401-913f-48338cabf3b3":{"pageInfoList":[{"id":"B5D26B4C72E4408CA71507A7D73773F4","path":"/sitecore/content
